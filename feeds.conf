#! ---- feeds pinned to the branch that matches this base tree ------------------
#!
#! The base is a 4.14 / 19.07-era tree (ggbruno/openwrt @ 8a0ccb9). The luci and
#! packages feeds' master branches have moved on: master's luci-base is
#! ucode-based and dies on ucode-mod-html / liblucihttp-ucode, and master split
#! miniupnpd into -iptables/-nftables so a plain `miniupnpd` dependency no
#! longer resolves. The 19.07 branches are the Lua-era LuCI and the package set
#! that actually build against this tree.
#!
#! feeds.conf overrides feeds.conf.default wholly, and it is gitignored inside
#! the OpenWrt tree -- which is why it is shipped from here, not from the
#! overlay.
#!
#! ⚠ TRAP, and the reason CI failed once. scripts/feeds is Perl and strips
#! comments with  s/#.+$//  -- ONE OR MORE characters after the hash. A line
#! containing only "#" therefore survives the strip, matches /\S/, fails the
#! src-<type> regex, and dies with "Syntax error in feeds.conf, line N" pointing
#! at a line that looks perfectly commented out. Hence every line in this header
#! starts with "#!" rather than a bare "#". If you reformat this file, keep it
#! that way -- the failure is at `./scripts/feeds update`, i.e. after the whole
#! base tree has already been cloned.
#!
#! Only feeds build.sh actually updates are listed. routing/telephony were
#! dropped: `./scripts/feeds update luci packages` never refreshes them, so they
#! sat here as entries nothing installed from, which is worse than absent.
src-git luci https://git.openwrt.org/project/luci.git;openwrt-19.07
src-git packages https://git.openwrt.org/feed/packages.git;openwrt-19.07
