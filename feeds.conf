#! ---- feeds for the 6.18 / latest-OpenWrt base -------------------------------
#!
#! The base is plain upstream openwrt/openwrt @ 82e2e4f4 (kernel 6.18.41), so
#! both feeds track master, pinned by commit rather than by branch. The pin is
#! the pair the platform overlay was built and hardware-tested with (its
#! versions.sh); floating master is how an ABI breaks between two CI runs of
#! the same commit.
#!
#! feeds.conf overrides feeds.conf.default wholly, and it is gitignored inside
#! the OpenWrt tree -- which is why it ships from here, not from the overlay.
#!
#! ⚠ TRAP, and the reason CI failed once on the 4.14 line. scripts/feeds is
#! Perl: it strips comments with  s/#.+$//  (ONE OR MORE characters after the
#! hash) at scripts/feeds:54, then requires /\S/ at :56, then matches the src
#! regex at :58 and dies at :60 with "Syntax error in feeds.conf, line N". A
#! line containing only "#" therefore survives the strip, is not whitespace,
#! is not a src-<type> line, and kills the update -- with an error message
#! pointing at a line that looks perfectly commented out. Re-checked at this
#! base rev: the three lines are identical, so the rule is unchanged. Hence
#! every comment line below starts with "#!". Keep it that way; the failure
#! lands after the whole base tree has already been cloned.
#!
#! The revision selector matters, not just the value:
#!   URL^<commit>   -> scripts/feeds clones --depth 1 then fetches that SHA and
#!                     NEVER updates again (update_feed_via: "in case git hash
#!                     has been provided don't update the feed"). Reproducible;
#!                     needs the server to answer fetch-by-SHA (git.openwrt.org
#!                     and the GitHub mirrors both do).
#!   URL;<branch>   -> a branch tip that moves. Not what we want to pin to.
#!
#! LuCI here is the ucode stack (ucode-mod-html, liblucihttp-ucode, rpcd-mod-
#! ucode), which is precisely what the 4.14 line could not build and why feeds
#! were pinned to openwrt-19.07 there. firewall4/nftables is the counterpart:
#! iptables-era LuCI apps and qos-scripts do not drive the packet filter any
#! more, so the seed selects miniupnpd-nftables and drops qos-scripts.
#!
#! Only feeds that something is installed from are listed -- routing and
#! telephony sat unused on the 4.14 line, and an entry nothing installs from is
#! worse than no entry (it still gets cloned by `feeds update -a`).
src-git packages https://git.openwrt.org/feed/packages.git^712ee13a837449fd91b5279048303d3a790d691b
src-git luci https://git.openwrt.org/project/luci.git^4c0a4eda5ea17f9e81fc860366d7d04ce3c21b8e
