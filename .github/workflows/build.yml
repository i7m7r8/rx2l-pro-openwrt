name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'files/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      # NOT 'port/**': nothing under port/ is read by the build -- it is staged
      # sources, reports and evidence. A port/** path filter turned every
      # documentation commit into a 3-hour run (and pushed concurrent builds
      # past the point where their logs were readable).
      - 'Dockerfile'
      - 'build.sh'
      - 'feeds.conf'
      - 'feeds.conf.new'
      - 'seed.config'
      - 'seed.config.new'
      - '.github/workflows/build.yml'
  pull_request:

permissions:
  contents: read

jobs:
  # Fast gate: the two things that decide whether a build is worth two hours of
  # runner. Both run before the base tree is even cloned, because both failure
  # modes cost a full clone plus a silent, wrong image.
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build tenda-wrap
        run: |
          # The path follows the file: it ships as a standalone HostBuild under
          # files/tools/tenda-wrap/ (on this base tools/firmware-utils is a
          # git-fed package with no in-tree src/, so a .c dropped there is
          # simply not compiled). This step is what keeps the tool honest even
          # when the OpenWrt image job is skipped.
          gcc -Wall -Wextra -Werror -O2 -o /tmp/tenda-wrap \
            files/tools/tenda-wrap/src/tenda-wrap.c

      - name: Round-trip a synthetic container
        run: python3 tests/test_container.py

      # The build runs files/scripts/rx2lpro-image-gates.py ($(TOPDIR)/scripts/
      # in the tree); the tests run scripts/rx2lpro-image-gates.py. Identical
      # today, and a silent divergence would mean CI validating a different
      # gate than the one that decides whether an image is produced.
      - name: the two copies of the image gates are the same file
        run: |
          cmp scripts/rx2lpro-image-gates.py files/scripts/rx2lpro-image-gates.py
          echo "scripts/ and files/scripts/ agree"

      # files/ is copied OVER the platform overlay, so anything stale in it does
      # not merely sit in the tree -- it replaces a 6.18 file with a 4.14 one.
      # That is how the 10:37 run lost CONFIG_TARGET_rtl819x entirely: a 4.14
      # target Makefile (BOARD:=realtek) shadowed the overlay's, `make defconfig`
      # dropped every symbol in the seed, and the failure only surfaced ~90 s
      # into the real build. These four checks cost under a second and run
      # before the base tree is cloned.
      - name: files/ carries nothing a 6.18 tree cannot use
        run: |
          # rc is managed explicitly: GitHub runs this with bash -e, and
          # `var=$(cmd | grep -v ...)` returns the pipeline's status, so a
          # legitimate "nothing matched" would abort the step with no message.
          set +e
          rc=0
          # 1. No kernel-version-pinned TREES in the build overlay.
          #    files-<ver>/ and patches-<ver>/ are whole 4.14-era layers that
          #    would be copied in and silently ignored (or worse, partially
          #    matched); they belong under port/, where they cannot shadow
          #    anything. A single config-<ver> file is legitimate -- it is how a
          #    subtarget enables the symbols its own board needs -- but only for
          #    the kernel this port actually builds (6.18, from the platform
          #    overlay's KERNEL_PATCHVER). A config-4.14 is stale by definition.
          stale=$(find files -maxdepth 8 \( -name 'files-*.*' -o -name 'patches-*.*' \
                    -o -name 'config-[0-9]*' \) -print 2>/dev/null | grep -v '/config-6\.18$')
          if [ -n "$stale" ]; then
            echo "!!! kernel-versioned material inside files/ (belongs under port/," >&2
            echo "    or is pinned to a kernel this port does not build):" >&2
            echo "$stale" >&2
            rc=1
          fi
          # 2. Pre-21.02 image-recipe syntax is silently ignored by modern
          #    image.mk: the device simply does not exist and no DEVICE_* symbol
          #    is generated.
          if grep -rnE "DEVICE_TITLE[[:space:]]*:=" files/target 2>/dev/null; then
            echo "!!! pre-21.02 image syntax in files/target (DEVICE_TITLE/PROFILES)" >&2
            rc=1
          fi
          # 3. A target Makefile may not set its own BOARD/ARCH/PATCHVER: the
          #    platform owns the target on this base, and a shadowing copy is
          #    exactly the failure above.
          for mk in $(find files/target/linux -mindepth 2 -maxdepth 2 -name Makefile 2>/dev/null); do
            if grep -qE "KERNEL_PATCHVER|^ARCH:=|^BOARD:=" "$mk"; then
              echo "!!! $mk declares target identity; on this base the target comes from the overlay" >&2
              echo "    (if it must exist, it has to match the overlay exactly -- see build.sh)" >&2
              rc=1
            fi
          done
          # 4. The device profile name has to match the seed, or the symbol is
          #    dropped silently: Kconfig spells it DEVICE_$(subst -,_,NAME).
          dev=$(grep -rhoE "^define Device/[A-Za-z0-9_.-]+" files/target/linux/*/image/*.mk 2>/dev/null \
                | sed 's|.*/||' | tr -d '\r')
          for d in $dev; do
            sym="$(echo "$d" | tr '-' '_')"
            if ! grep -q "DEVICE_${sym}=y" seed.config; then
              echo "!!! device '$d' has no CONFIG_TARGET_..._DEVICE_${sym}=y in seed.config" >&2
              rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "files/ is 6.18-clean and every device has a seed symbol"
          exit $rc

      # feeds.conf is parsed by a Perl script that strips comments with
      # s/#.+$// -- one or MORE characters after the hash. A line whose only
      # content is "#" therefore survives the strip, is not whitespace, is not
      # a src-<type> line, and dies with "Syntax error in feeds.conf, line N"
      # pointing at a line that looks perfectly commented out -- after the base
      # tree has been cloned and the compile started. This is the same five
      # lines scripts/feeds:54-61 uses at base rev 82e2e4f4, verified locally
      # by running that script's `feeds list -n` against the file.
      - name: feeds.conf parses the way scripts/feeds parses it
        run: |
          perl -e '
            my $n = 0;
            open my $fh, "<", "feeds.conf" or die "no feeds.conf";
            while (<$fh>) {
              chomp; s/#.+$//; $n++;
              next unless /\S/;
              my ($type, $flags, $name, $urls) =
                m!^src-([\w\-]+)((?:\s+--\w+(?:=\S+)?)*)\s+(\w+)(?:\s+(\S.*))?$!;
              die "Syntax error in feeds.conf, line $n\n" unless $type && $name;
              print "ok  line $n: $name -> ", ($urls // ""), "\n";
            }
          '

      # A DTS partition label is not cosmetic: the kernel splitter only runs on
      # a partition named CONFIG_MTD_SPLIT_FIRMWARE_NAME, and platform.sh writes
      # PART_NAME=firmware. Rename the node and the image flashes fine and then
      # dies at "Unable to mount root fs on unknown-block(0,0)" -- a class of
      # failure no compile can catch. Same for a config that forgets to enable
      # the splitter at all.
      - name: DTS + kernel-config invariants that only fail on hardware
        run: |
          set +e
          rc=0
          dts=files/target/linux/rtl819x/dts/rtl8197f_tenda_rx2lpro.dts
          [ -f "$dts" ] || { echo "!!! $dts missing" >&2; exit 1; }

          # 1. the container partition must be named "firmware"
          if ! grep -q 'label = "firmware";' "$dts"; then
            echo "!!! $dts has no partition labelled \"firmware\" -- mtdsplit" >&2
            echo "    will not run and mount_root will find no rootfs" >&2
            rc=1
          fi
          # 2. ...and the vendor name must not come back
          if grep -q 'label = "KernelFS";' "$dts"; then
            echo "!!! vendor label KernelFS used for the container partition" >&2
            rc=1
          fi
          # 3. no root= in bootargs: the root device comes from the splitter
          if sed -n '/chosen {/,/};/p' "$dts" | grep -q 'bootargs.*root='; then
            echo "!!! chosen/bootargs pins root=; OpenWrt finds rootfs via mtdsplit" >&2
            rc=1
          fi
          # 4. the splitters must be enabled, and the rootfs_data one with them
          kcfg=files/target/linux/rtl819x/rtl8197f/config-6.18
          for sym in CONFIG_MTD_SPLIT_CVIMG_FW CONFIG_MTD_SPLIT_SQUASHFS_ROOT; do
            grep -qx "${sym}=y" "$kcfg" 2>/dev/null || {
              echo "!!! ${sym}=y missing from $kcfg" >&2; rc=1; }
          done
          # 5. board_name is the DTS compatible's FIRST string on this base
          #    (02_sysinfo: strings /proc/device-tree/compatible | head -1).
          #    Every consumer must match it. When it did not, the MAC read out
          #    of CFG never ran and the cr6c sysupgrade gate fell through to
          #    "accept anything" -- both silently, both only on hardware.
          bname=$(sed -n 's/.*compatible *= *"\([^"]*\)".*/\1/p' "$dts" | head -1)
          short="${bname##*,}"
          for f in files/target/linux/rtl819x/base-files/etc/board.d/02_network \
                   files/target/linux/rtl819x/base-files/lib/upgrade/platform.sh; do
            if ! grep -q "\*${short}" "$f"; then
              echo "!!! $f has no case arm matching board_name '$bname'" >&2
              echo "    (expected a '*${short}' pattern; the DTS compatible string" >&2
              echo "     is what this base writes to /tmp/sysinfo/board_name)" >&2
              rc=1
            fi
          done

          # NOTE: $kcfg is a whole-file override of the overlay's subtarget
          # config, so an overlay update to that file lands under ours. build.sh
          # prints every such override ("files/ overrides overlay file: ...");
          # re-sync it when the overlay's copy changes.
          [ $rc -eq 0 ] && echo "DTS and splitter config agree with the upgrade path"
          exit $rc

  # The real build. Debian 13 (trixie) container because the base is current
  # upstream: kernel 6.18.41, python3.13 host tools, no python2 anywhere.
  #
  # OpenWrt refuses to build as root, and the tree must end up owned by the
  # runner's uid or git aborts with "detected dubious ownership" (exit 128,
  # before any compile). Hence --user $(id -u):$(id -g) with HOME pointed at a
  # path the run creates itself, and the :rw on the bind mount. Proven on the
  # 4.14 line; unchanged here for exactly that reason.
  openwrt:
    needs: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the toolchain container
        run: docker build -t owrt-rx2lpro .

      - name: Build OpenWrt
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/owrt-home \
            -v "$GITHUB_WORKSPACE":/build:rw \
            -w /build \
            owrt-rx2lpro bash -c 'mkdir -p "$HOME" && ./build.sh'

      - name: Record what was produced
        run: |
          ls -la openwrt/bin/targets/rtl819x/rtl8197f/ || true
          # The seed's whole failure mode is a symbol dropped silently at
          # defconfig time; printing the resolved selection costs nothing and
          # is the only place the drop becomes visible after the build.
          grep -E '^CONFIG_(TARGET_rtl819x|TARGET_ROOTFS|PACKAGE_(luci|uhttpd|firewall4|swconfig|rtlmib|kmod-nft-offload)|KERNEL_(LZMA|SQUASHFS))' \
            openwrt/.config || true
          cat MANIFEST-built.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: rx2lpro-images
          path: |
            openwrt/bin/targets/rtl819x/rtl8197f/*.bin
            openwrt/bin/targets/rtl819x/rtl8197f/*.itb
            MANIFEST-built.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: rx2lpro-config
          path: |
            openwrt/.config
            openwrt/.rx2l-applied
          if-no-files-found: warn
          retention-days: 30
